<script>
/* ===========================
   Config / Sheet ID
   =========================== */
const SHEET_ID = "1Ws2WH9ZT7-aBSlJAKqBHCWqTO57Ayxvj2ZPQxSSVUiI";
/* ===========================
   DOM Helpers & Globals
   =========================== */
const el = id => document.getElementById(id);
const loginView = el("loginView"), appView = el("appView"), loginMsg = el("loginMsg");
let currentUser = null, currentTab = "", tableData = [], currentPage = 1, rowsPerPage = 20, sortColumn = "", sortDir = 1;
let homeInfo = {}, USERS = {}, TEMPLATES = {}, SETTINGS = {}, MEMBERS = {}, ROLE_ACCESS = {};
/* ---------------------------
   Utility helpers
   --------------------------- */
function onlyDigits(s){
  return String(s||"").replace(/\D/g,"");
}
function toNumber(val){
  if(val===undefined||val===null||val==="") return 0;
  return Number(String(val).replace(/[^0-9.-]/g,"")) || 0;
}

function formatDate(d){
  if(!d) return "";
  return String(d); // keep dd/mm/yyyy as-is
}
// ✅ PASTE HERE
function parseDDMMYYYY(dateStr){
  if(!dateStr) return null;
  const parts = dateStr.split("/");
  if(parts.length !== 3) return null;
  const [dd, mm, yyyy] = parts.map(Number);
  return new Date(yyyy, mm - 1, dd);
}
function getHiddenColumnsForTab(tabName){
  if(!SETTINGS || !tabName) return new Set();
  const key = `HideColumns.${tabName}`;
  const val = SETTINGS[key];
  if(!val) return new Set();
  return new Set(
    val.split(",")
       .map(c => c.trim())
       .filter(Boolean)
  );
}
/* ---------------------------
   Template message helper
   --------------------------- */
function getMessageFromTemplate(type, row) {
  let template = TEMPLATES[type] || "";
  if (!template) return "";
  for (let key in row) {
    template = template.replace(new RegExp(`{{${key}}}`, "g"), row[key] || "");
  }
  template = template.replace(/{{Date}}/g, formatDate(row["Date"]));
  template = template.replace(/{{Amount}}/g, toNumber(row["Amount"]).toLocaleString());
  return template.replace(/\\n/g, "\n");
}
/* ===========================
   Fetch helper (OpenSheet)
   =========================== */
async function fetchSheet(sheetName){
  try{
    const res = await fetch(`https://opensheet.elk.sh/${SHEET_ID}/${encodeURIComponent(sheetName)}`);
    const json = await res.json();
    return Array.isArray(json)?json:[];
  }catch(e){ console.error('fetchSheet error', e); return []; }
}
// 🔍 Global search listener (ALL tabs)
const searchBox = document.getElementById("searchInput");
searchBox.addEventListener("input", () => {
  currentPage = 1;        // search pe first page
  renderTable();          // re-render table
});
/* ===========================
   Load data: Users, Templates, Settings, Members
   =========================== */
async function loadUsers(){
  const data = await fetchSheet("Users");
  const users = {};
  data.forEach(row=>{
    if(!row.Username) return;
    users[row.Username] = {
      password: row.Password,
      role: row.Role,
      name: row.Name,
      access: row.Access ? row.Access.split(",").map(s=>s.trim()).filter(Boolean) : []
    };
  });
  return users;
}
async function loadTemplates(){
  const data = await fetchSheet("Templates");
  const templates = {};
  data.forEach(row=>{
    if(row.Type) templates[row.Type] = row.Message || "";
  });
  return templates;
}
async function loadSettings(){
  const data = await fetchSheet("Settings");
  const settings = {};
  data.forEach(r=>{
    if(r.Key) settings[r.Key] = r.Value;
  });
  return settings;
}
async function loadMembers(){
  const data = await fetchSheet("Members");
  const map = {};
  data.forEach(r=>{
    const mobileKey = onlyDigits(r["Mobile"] || r["mobile"] || "");
    if(mobileKey) {
      map[mobileKey] = r;
    }
  });
  return map;
}
// -------- Load footer content from Settings sheet --------
async function loadFooter(){
  try{
    const rows = await fetchSheet("Settings");
    const footerEl = document.getElementById("footer");
    if(!footerEl) return;

    if(!rows || rows.length === 0){
      footerEl.textContent = "Footer data not available.";
      return;
    }
    // Convert rows to key:value map
    const settings = {};
    rows.forEach(r => {
      if(r.Key) settings[String(r.Key).trim()] = (r.Value || "").trim();
    });
    const society = settings["SocietyName"] || "समाज";
    const address = settings["Address"] || "";
    const contact = settings["Contact"] || "";
    const email = settings["Email"] || "";
    const year = settings["Year"] || new Date().getFullYear();
    // Build each line
    const secondLine = address || "";
    const thirdLineParts = [];
    if(contact) thirdLineParts.push(`<a href="tel:${contact}">✆${contact}</a>`);
    if(email) thirdLineParts.push(`<a href="mailto:${email}">✉️${email}</a>`);
    thirdLineParts.push(`©${year}`);
    const thirdLine = thirdLineParts.join('&nbsp;•&nbsp;');
    // Set footer HTML
    footerEl.innerHTML = `
      <div class="line">🙏 ${society} 🙏</div>
      <div class="line">${secondLine}</div>
      <div class="line">${thirdLine}</div>
    `;
  }catch(err){
    console.error("Footer load error:", err);
    const footerEl = document.getElementById("footer");
    if(footerEl) footerEl.textContent = "Footer लोड नहीं हो पाया।";
  }
}
/* ===========================
   INIT
   =========================== */
async function init(){
  USERS = await loadUsers();
  TEMPLATES = await loadTemplates();
  SETTINGS = await loadSettings();
  MEMBERS = await loadMembers();
  ROLE_ACCESS = await loadRoleAccess();
  if(SETTINGS["HeaderTitle"]) document.querySelector("header h1").textContent = SETTINGS["HeaderTitle"];
  if(SETTINGS["RegNo"]) document.querySelector("header .muted").textContent = "Reg No: " + SETTINGS["RegNo"];
  if(SETTINGS["RowsPerPage"]) rowsPerPage = Number(SETTINGS["RowsPerPage"]) || rowsPerPage;
  await renderLoginHomeStructure();
 applyLoginTexts(); 
  await renderMeetingUpdates();
  await renderAnnouncements();
await loadFooter();
}
init();
function applyLoginTexts(){
  if(SETTINGS?.LoginTitle)
    el("loginTitle").innerText = SETTINGS.LoginTitle;
  if(SETTINGS?.["LoginLabels.mobile"])
    el("labelMobile").innerText =
      SETTINGS["LoginLabels.mobile"];
  if(SETTINGS?.["LoginLabels.password"])
    el("labelPassword").innerText =
      SETTINGS["LoginLabels.password"];
  if(SETTINGS?.["LoginPlaceholders.username"])
    el("username").placeholder =
      SETTINGS["LoginPlaceholders.username"];
  if(SETTINGS?.["LoginPlaceholders.password"])
    el("password").placeholder =
      SETTINGS["LoginPlaceholders.password"];
  if(SETTINGS?.LoginButtonText)
    el("loginBtn").innerText =
      SETTINGS.LoginButtonText;
}
const newUserBtn = document.getElementById("newUserBtn");
if (newUserBtn) {
  newUserBtn.onclick = () => {
    // 🔹 Mobile from Settings
    const mobile =
      SETTINGS?.NewUserWhatsAppMobile ||
      SETTINGS?.AdminMobile ||

/* ---------- BUILD TABS ---------- */
function buildTabs() {
  // 🛑 LOGIN GUARD (MOST IMPORTANT)
  if (!currentUser || !currentUser.role) {
    console.warn("buildTabs skipped: user not logged in yet");
    return;
  }
  const tabs = el("tabs");
  tabs.innerHTML = "";
  const role = currentUser.role;
  const accessList = ROLE_ACCESS?.[role];
  if (!accessList) {
    console.error("No RoleAccess for role:", role);
    return;
  }
  let first = true;
  Object.keys(accessList).forEach(tabName => {
    const cfg = accessList[tabName];
    if (!cfg.canView) return;
    const d = document.createElement("div");
    d.className = "tab" + (first ? " active" : "");
    first = false;
    d.textContent = tabName;
    // ✅ tab click = auto refresh
    d.onclick = () => setActiveTab(tabName);
    tabs.appendChild(d);
  });

/* ---------- TAB CHANGE ---------- */
function setActiveTab(name){
  // safety
  if (!name) return;
  document.querySelectorAll(".tab")
    .forEach(t => t.classList.remove("active"));
  const found = [...document.querySelectorAll(".tab")]
    .find(t => t.textContent === name);
  if(found) found.classList.add("active");
  currentTab = name;
  currentPage = 1;
  sortColumn = "";
  sortDir = 1;
  // 🔥 AUTO REFRESH ONLY HERE
  loadTab(name);
}
/* ---------- LOAD TAB DATA ---------- */
async function loadTab(sheetName) {
  el("contentArea").innerHTML =
    "<div class='muted'>Loading " + sheetName + "...</div>";
  el("searchInput").style.display = "none";
  el("searchInput").value = "";
  el("pagination").innerHTML = "";
  try {
    // 1. Fetch the sheet data
    tableData = await fetchSheet(sheetName);
    // 2. Apply Active filter ONLY for Member tab
    if (sheetName === "Members") {
      const activeValue = (SETTINGS?.ActiveStatusValue || "Active").toLowerCase();
      // ✅ Filter rows safely: trim, toLowerCase, check exact match
      tableData = tableData.filter(row => {
        if (!row.hasOwnProperty("Status")) return false;
        const status = String(row.Status || "").trim().toLowerCase();
        return status === activeValue;
      });
    }
    // 3. Check if any data available
    if (!tableData.length) {
      el("contentArea").innerHTML =
        "<div class='muted'>No data in " + sheetName + "</div>";
      return;
    }
    // 4. Render table
    el("contentArea").innerHTML = "<div id='tableContainer'></div>";
    el("searchInput").style.display = "block";
    renderTable();
  } catch (e) {
    console.error(e);
  }
}
/* ---------- RENDER TABLE ---------- */
function renderTable(){
  // 🛑 safety guards
  if (!currentUser || !currentTab || !Array.isArray(tableData)) return;
  let filteredData = [...tableData];
  const searchVal =
    el("searchInput").value.trim().toLowerCase();
  // Role + tab config (safe)
  const tabConfig =
    ROLE_ACCESS?.[currentUser.role]?.[currentTab];
  /* ======================
     🔍 SEARCH (ALL TABS)
     ====================== */
  if (searchVal) {
    filteredData = filteredData.filter(row =>
      Object.entries(row).some(([k, v]) => {
        if (!k) return false;
        const key = k.toLowerCase();
        if (key === "password" || key === "role") return false;
        return String(v ?? "").toLowerCase().includes(searchVal);
      })
    );
  }
  /* ======================
     🔐 OWN / ALL FILTER
     ====================== */
  if (tabConfig?.tabScope?.toLowerCase() === "own") {
    filteredData = filteredData.filter(row => {
      const member =
        row[SETTINGS?.MemberColumn] ||
        row["Member"] ||
        row["Name"] ||
        "";
      return member.trim() === currentUser.name.trim();
    });
  }
  /* ======================
     🔃 SORTING (SAFE)
     ====================== */
  if (sortColumn) {
    filteredData.sort((a, b) => {
      let va = a[sortColumn] ?? "";
      let vb = b[sortColumn] ?? "";
      const na = toNumber(va);
      const nb = toNumber(vb);
      // number sort
      if (!isNaN(na) && !isNaN(nb) && (na !== 0 || nb !== 0)) {
        return (na - nb) * sortDir;
      }
      // text sort
      return String(va).localeCompare(String(vb), "en", {
        numeric: true,
        sensitivity: "base"
      }) * sortDir;
    });
  }
  const totalPages = Math.ceil(filteredData.length / rowsPerPage) || 1;
  if(currentPage > totalPages) currentPage = 1;
  const start = (currentPage-1)*rowsPerPage;
  const pageData = filteredData.slice(start,start+rowsPerPage);
  if(pageData.length === 0){el("tableContainer").innerHTML="<p class='muted'>No records found</p>";return;}
  // Columns (skip password & role)
// 🔥 tab-wise hidden columns
const hiddenCols = getHiddenColumnsForTab(currentTab);

  let html = "<table><thead><tr>";

  html += "<th>Actions</th></tr></thead><tbody>";
  pageData.forEach(row => {
    html += "<tr>";
columns.forEach(c => {

  const cl = c.toLowerCase();

  // 🔢 ALL numeric / money columns (FINAL LIST)
  if (
    cl.includes("amount") ||
    cl.includes("received") ||     // 🔥 FIX (THIS WAS MISSING)
    cl.includes("pledged") ||
    cl.includes("paid") ||
    cl.includes("credit") ||
    cl.includes("debit") ||
    cl.includes("payment") ||
    cl.includes("balance") ||
    cl.includes("closing") ||
    cl.includes("pending")
  ) {
    html += `<td style="text-align:right">
      ${toNumber(row[c]).toLocaleString()}
    </td>`;
  }

  // 📅 Date columns
  else if (cl.includes("date")) {
    html += `<td>${formatDate(row[c])}</td>`;
  }

  // 📝 Normal text
  else {
    html += `<td>${row[c] || ""}</td>`;
  }

});

    // Actions column

    html += "<td>" + renderActionButtons(row, encId) + "</td>";

    rows += rowItem("उद्देश्य (For)", rec["For"] || rec["Purpose"] || "");
    rows += rowItem("भुगतान का तरीका (Mode)", rec["Mode"] || "");
    rows += rowItem("नोट्स", rec["Notes"] || "");
    rows += rowItem("प्रकार (Type)", rec[SETTINGS?.FundLedgerTypeColumn || "Type"] || "");
  }
  // Receipts
  else if (currentTab === "Receipts") {
    heading = "रसीद";
    rows += rowItem("रसीद नंबर", rec["ID"]);
    rows += rowItem("तारीख", formatDateLocal(rec["Date"]));
    rows += rowItem("सदस्य का नाम ", rec[SETTINGS?.MemberColumn] || rec["Member"]);
    rows += rowItem("रसीद राशि (₹)", rec["Received"]);
    rows += rowItem("उद्देश्य (For)", rec["For"]);
    rows += rowItem("भुगतान का तरीका (Mode)", rec["Mode"]);
    rows += rowItem("नोट्स", rec["Notes"]);
    rows += rowItem("प्रकार (Type)", rec["Type"]);
  }
  // Expenses
  else if (currentTab === "Expenses") {
    heading = "खर्चा विवरण";
    rows += rowItem("खर्चा नंबर", rec["ID"]);
    rows += rowItem("तारीख", formatDateLocal(rec["Date"]));
    rows += rowItem("सदस्य का नाम ", rec[SETTINGS?.MemberColumn] || rec["Member"]);
    rows += rowItem("भुगतान राशि  (₹)", toNumberLocal(rec["Payment"]).toLocaleString());
    rows += rowItem("उद्देश्य (For)", rec["For"]);
    rows += rowItem("भुगतान का तरीका (Mode)", rec["Mode"]);
    rows += rowItem("नोट्स", rec["Notes"]);
    rows += rowItem("प्रकार (Type)", rec["Type"]);
  }
  // Boli
  else if (currentTab === "Boli") {
    heading = "बोली विवरण";
    const pledged = toNumberLocal(rec[SETTINGS?.BoliPledgedColumn] || rec["Pledged Boli"]);
    const paid = toNumberLocal(rec[SETTINGS?.BoliPaidColumn] || rec["Paid Boli"]);
    const balance = toNumberLocal(rec["Pending Dues Boli"] || (pledged - paid));
    rows += rowItem("बोली नं", rec["ID"]);
    rows += rowItem("तारीख", formatDateLocal(rec["Date"]));
    rows += rowItem("सदस्य का नाम ", rec[SETTINGS?.MemberColumn] || rec["Member"]);
    rows += rowItem("मोबाइल", rec[SETTINGS?.MobileColumn] || rec["Mobile"] || "");
    rows += rowItem("बोली राशि ₹", pledged.toLocaleString());
    rows += rowItem("भुगतान राशि ₹", paid.toLocaleString());
    rows += rowItem("बैलेंस राशि ₹", balance.toLocaleString());
    rows += rowItem("उद्देश्य (For)", rec["For"]);
  }
  // Donation
  else if (currentTab === "Donation") {
    heading = "दान विवरण";
    const pledged = toNumberLocal(rec[SETTINGS?.DonationPledgedColumn] || rec["Pledged Donation"]);
    const paid = toNumberLocal(rec[SETTINGS?.DonationPaidColumn] || rec["Paid Donation"]);
    const balance = toNumberLocal(rec["Pending Dues Donation"] || (pledged - paid));
    rows += rowItem("दान नं", rec["ID"]);
    rows += rowItem("तारीख", formatDateLocal(rec["Date"]));
    rows += rowItem("सदस्य का नाम ", rec[SETTINGS?.MemberColumn] || rec["Member"]);
    rows += rowItem("मोबाइल", rec[SETTINGS?.MobileColumn] || rec["Mobile"] || "");
    rows += rowItem("दान राशि ₹", pledged.toLocaleString());
    rows += rowItem("भुगतान राशि ₹", paid.toLocaleString());
    rows += rowItem("बैलेंस राशि ₹", balance.toLocaleString());
    rows += rowItem("उद्देश्य (For)", rec["For"]);
  }
  // fallback
  else {
    heading = currentTab + " विवरण";
    for (let k in rec) rows += rowItem(k, rec[k]);
  }
  // render popup
  el("popupTitle").innerText = heading;
  el("popupBody").innerHTML = `<table class="popup-table">${rows}</table>`;
  el("receiptPopup").style.display = "flex";
  el("popupPrintBtn").onclick = () => {
    printPopupReceiptContent(heading, `<table class="popup-table">${rows}</table>`);
  };
  el("popupCloseBtn").onclick = () => {
    el("receiptPopup").style.display = "none";
  };
}
/* ===========================

<!-- Dynamic footer (replace existing footer element) -->
<footer id="footer" class="site-footer" aria-label="Site footer">

/* ===========================
   EDIT (Admin) - local edits only
   =========================== */
function openEditRecord(incomingEnc, e){
  if (e && e.preventDefault) e.preventDefault();
  const incoming = decodeURIComponent(incomingEnc || "");
  let recIndex = tableData.findIndex(r => (r["ID"] || "") === incoming);
  if(recIndex === -1){
    // try match by member column / name
    recIndex = tableData.findIndex(r => (r[SETTINGS?.MemberColumn] || r["Member"] || "") === incoming);
  }
  if(recIndex === -1){
    alert("रिकॉर्ड नहीं मिला।");
    return;
  }
  const rec = {...tableData[recIndex]}; // copy
  // Build fields
  const container = el("editFields");
  container.innerHTML = "";
  Object.keys(rec).forEach(k => {
    if(!k) return;
    const kl = k.toLowerCase();
    if(kl === "password" || kl === "role") return; // hidden fields not editable here
    const val = rec[k] || "";
    const id = "ef_"+k.replace(/\s+/g,"_");
    const label = document.createElement("label"); label.textContent = k;
    const input = document.createElement(k.toLowerCase().includes("note") || k.toLowerCase().includes("for") ? "textarea" : "input");
    input.id = id;
    input.value = val;
    container.appendChild(label);
    container.appendChild(input);
  });
  el("editTitle").textContent = "Edit: " + (rec["ID"]||rec[SETTINGS?.MemberColumn]||"Record");
  el("editPopup").style.display = "flex";
  el("saveEditBtn").onclick = () => {
    // apply values back to tableData (local only)
    Object.keys(rec).forEach(k => {
      if(!k) return;
      const kl = k.toLowerCase();
      if(kl === "password" || kl === "role") return;
      const id = "ef_"+k.replace(/\s+/g,"_");
      const node = document.getElementById(id);
      if(node) tableData[recIndex][k] = node.value;
    });
    el("editPopup").style.display = "none";
    renderTable();
    alert("रिकॉर्ड UI में अपडेट हो गया है। (नोट: Google Sheet में परिवर्तन के लिए स्क्रिप्ट/परमिशन ज़रूरी होंगे।)");
  };
  el("cancelEditBtn").onclick = () => {
    el("editPopup").style.display = "none";
  };
}
/* ===========================
   DELETE (Admin) - local only
   =========================== */
function deleteRecord(incomingEnc, e){
  if (e && e.preventDefault) e.preventDefault();
  const incoming = decodeURIComponent(incomingEnc || "");
  if(!confirm("क्या आप वाकई इस रिकॉर्ड को हटाना चाहते हैं? (इससे Google Sheet से नहीं हटेगा — केवल UI से हटेगा)")) return;
  // find index
  let idx = tableData.findIndex(r => (r["ID"]||"") === incoming);
  if(idx === -1) idx = tableData.findIndex(r => (r[SETTINGS?.MemberColumn] || r["Member"] || "") === incoming);
  if(idx === -1){
    alert("रिकॉर्ड नहीं मिला।");
    return;
  }
  tableData.splice(idx,1);
  renderTable();
  alert("रिकॉर्ड UI से हटा दिया गया है (स्थायी नहीं — Google Sheet पर बदलाव के लिए API आवश्यक)।");
}
/* helper for print rows fallback (keeps earlier compatibility) */
function rowItem(label,val){return `<tr><td style="font-weight:bold;width:40%">${label}</td><td>${val||""}</td></tr>`;}
/* pagination / sort / search */
function renderPagination(total){
  let html=""; for(let i=1;i<=total;i++){
    html+=`<button class="page-btn ${i===currentPage?'active':''}" onclick="gotoPage(${i})">${i}</button>`;
  }
  el("pagination").innerHTML=html;
}
function gotoPage(p){ currentPage=p; renderTable(); }
function sortBy(c){ if(sortColumn===c){ sortDir*=-1; } else { sortColumn=c; sortDir=1; } renderTable(); }
el("searchInput").oninput = ()=>{ currentPage=1; renderTable(); };
</script>
