    const cb = document.createElement("input"); cb.type = "checkbox";
    const sp = document.createElement("span"); sp.textContent = line;
    lab.appendChild(cb); lab.appendChild(sp); box.appendChild(lab);
    rows.push({ line, cb });
  });

  // ---- 🍽️ Food option: Place ki tarah alag field (select) ----
  const foodGroup = document.createElement("div");
  const foodLabel = document.createElement("label");
  foodLabel.textContent = "भोजन / नाश्ता (Food)";
  const foodSel = document.createElement("select");
  foodSel.className = "smart-select";
  const optNo = new Option("-- कोई व्यवस्था नहीं --", "");
  const optYes = new Option("", "1");
  foodSel.appendChild(optNo); foodSel.appendChild(optYes);
  foodGroup.appendChild(foodLabel); foodGroup.appendChild(foodSel);

  let mealLine = mealLineForTime_(readTime());
  const refreshMealOption = () => {
    mealLine = mealLineForTime_(readTime());
    optYes.textContent = "🍽️ हाँ — " + mealLabelForTime_(readTime()) + " की व्यवस्था";
  };

  const lines = () => ta.value.split("\n").map(l => l.trim()).filter(Boolean);
  const pointSet = new Set(MEETING_AGENDA_POINTS);

  const syncFromText = () => {
    const cur = lines();
    rows.forEach(r => { r.cb.checked = cur.includes(r.line); });
    foodSel.value = cur.some(l => MEAL_LINE_RE.test(l)) ? "1" : "";
  };
  const rebuildText = () => {
    const custom = lines().filter(l => !pointSet.has(l) && !MEAL_LINE_RE.test(l));
    const pts = rows.filter(r => r.cb.checked).map(r => r.line);
    const out = [...pts, ...custom];
    if (foodSel.value === "1") out.push(mealLine);   // food hamesha sabse neeche
    ta.value = out.join("\n\n"); // har point alag line, beech mein khaali line
  };
  rows.forEach(r => r.cb.addEventListener("change", rebuildText));
  foodSel.addEventListener("change", () => { refreshMealOption(); rebuildText(); });
  ta.addEventListener("input", syncFromText);

  // Time badalne par khana/nashta ka shabd (subah/dopahar/shaam/raat) apne aap badal jaaye
  const onTimeChange = (ev) => {
    if (ev && ev.target === foodSel) return;
    refreshMealOption();
    if (foodSel.value === "1") rebuildText();
  };
  if (group.parentNode) {
    group.parentNode.addEventListener("input", onTimeChange);
    group.parentNode.addEventListener("change", onTimeChange);
  }

  ta.rows = 10;
  ta.style.minHeight = "180px";
  ta.style.lineHeight = "1.6";
  group.insertBefore(box, ta);

  // Food field ko Place ke theek baad lagao (form poora ban jaane ke baad, taaki field-order ka farq na pade)
  setTimeout(() => {
    const placeG = findGroupByLabel(/^(place|venue|location|स्थान)$/i);
    if (placeG) placeG.insertAdjacentElement("afterend", foodGroup);
    else if (group.parentNode) group.parentNode.insertBefore(foodGroup, group);
    refreshMealOption();
    syncFromText();
  }, 0);
  refreshMealOption();
  syncFromText();
}

function attachRecallDropdown_(textareaEl, wrapperGroup, recentValues) {
  if (!recentValues || !recentValues.length) return;
  const recall = document.createElement("select");
  recall.className = "smart-select";
  recall.style.marginBottom = "6px";
  recall.appendChild(new Option("-- पिछले में से चुनें (फिर edit करें) --", ""));
  recentValues.forEach(v => {
    // Dropdown mein poora text dikhana lamba ho sakta hai, isliye chhota preview dikhao
    const preview = v.length > 60 ? v.slice(0, 60) + "…" : v;
    recall.appendChild(new Option(preview, v));
  });
  recall.addEventListener("change", () => {
    if (recall.value) {
      textareaEl.value = recall.value;
      textareaEl.focus();
    }
  });
  wrapperGroup.insertBefore(recall, textareaEl);
}

function attachOtherToggle_(selectEl, wrapperGroup, key) {
  selectEl.addEventListener("change", () => {
    if (selectEl.value === "__other__") {
      const multiline = selectEl.dataset.multiline === "1";
      const textInput = document.createElement(multiline ? "textarea" : "input");
      textInput.id = selectEl.id;
      const hint = samplePlaceholder_(key);
      textInput.placeholder = hint || ("Naya " + key + " likhein");
      wrapperGroup.replaceChild(textInput, selectEl);
      if (multiline) wrapperGroup.style.gridColumn = "1 / -1";
      textInput.focus();
    }
  });
}

/* Sample/hint text har field ke liye — jo likhna hai wahi udhaharan dikhta hai */
function samplePlaceholder_(key) {
  const kl = key.toLowerCase();
  if (kl.includes("mobile")) return "जैसे: 9876543210";
  if (kl === "for" || kl.includes("purpose")) return "जैसे: सहयोग राशि, मकान मरम्मत";
  if (kl.includes("note") || kl.includes("remark")) return "अतिरिक्त जानकारी (optional)";
  if (kl.includes("received") || kl.includes("payment") || kl.includes("amount") ||
      kl.includes("credit") || kl.includes("debit")) return "जैसे: 500";
  if (kl === "type") return "जैसे: Donation, Boli, Expense";
  if (kl.includes("email")) return "जैसे: name@example.com";
  if (kl.includes("address")) return "पूरा पता लिखें";
  if (kl.includes("occupation")) return "जैसे: व्यापार, नौकरी";
  if (kl.includes("city")) return "जैसे: वापी";
  if (kl.includes("district")) return "जैसे: वलसाड";
  if (kl.includes("gotra")) return "गोत्र लिखें";
  if (kl.includes("origin")) return "मूल स्थान";
  return "";
}

function setSelectValueSafe_(selectEl, value) {
  if (!selectEl || !value) return;
  if (selectEl.tagName === "SELECT") {
    if (![...selectEl.options].some(o => o.value === value)) {
      // "Naya likhein" option se pehle insert karo
      const otherOpt = [...selectEl.options].find(o => o.value === "__other__");
      const newOpt = new Option(value, value);
      if (otherOpt) selectEl.insertBefore(newOpt, otherOpt);
      else selectEl.appendChild(newOpt);
    }
    selectEl.value = value;
  } else {
    selectEl.value = value;
  }
}

function isDateField_(key) {
  const kl = key.toLowerCase();
  return kl.includes("date") || kl.includes("birthday") || kl.includes("dob") ||
         kl.includes("joining") || kl.includes("joined") || kl.includes("anniversary");
}

// 🆕 Har row ka "ID" pehchanne ka common tarika. Members sheet mein ID column
// ka header "ID" nahi, "MemberID" hai — pehle sirf "ID" aur khaali/bekaar
// "Member" column check hota tha, isliye Members ke Edit/Delete/View mein
// "'ID' column nahi mila" wali error aati thi (aur galat row bhi select ho
// sakti thi, kyunki sab rows ka fallback ID khaali string "" ban jaata tha).
function resolveRecordId_(rec) {
  const memberCol = SETTINGS?.MemberColumn || "Member";
  if (rec["ID"]) return { idColumn: "ID", recordId: rec["ID"] };
  if (rec["MemberID"]) return { idColumn: "MemberID", recordId: rec["MemberID"] };
  if (rec[memberCol]) return { idColumn: memberCol, recordId: rec[memberCol] };
  if (rec["Member"]) return { idColumn: "Member", recordId: rec["Member"] };
  if (rec["Name"]) return { idColumn: "Name", recordId: rec["Name"] }; // 🆕 Members ke liye aakhri sahara
  return { idColumn: null, recordId: null };
}

function isoToday_() {
  const d = new Date();
  const mm = String(d.getMonth() + 1).padStart(2, "0");
  const dd = String(d.getDate()).padStart(2, "0");
  return `${d.getFullYear()}-${mm}-${dd}`;
}

function isoToDDMMYYYY_(iso) {
  if (!iso) return "";
  const [y, m, d] = iso.split("-");
  if (!y || !m || !d) return iso;
  return `${d}/${m}/${y}`;
}

function ddmmyyyyToISO_(val) {
  if (!val) return "";
  const m = String(val).match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (m) return `${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`;
  // agar already ISO ya Date-parseable hai
  const d = new Date(val);
  if (!isNaN(d)) {
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  }
  return "";
}

function todayDDMMYYYY_() {
  const d = new Date();
  const dd = String(d.getDate()).padStart(2, "0");
  const mm = String(d.getMonth() + 1).padStart(2, "0");
  return `${dd}/${mm}/${d.getFullYear()}`;
}

async function openAddRecordForm(sheetName) {
  const crudCfg = CRUD_ALLOWED_TABS[sheetName];
  if (!crudCfg) return;

  // Columns: tableData se lo agar data hai, warna khaali form nahi bana sakte
  // 🆕 SYNTHETIC_DISPLAY_COLUMNS ko yahan se hata do — yeh sirf table mein
  // dikhane ke liye webapp khud banata hai, yeh sheet ke real columns nahi hain
  let columns = tableData.length
    ? Array.from(new Set(tableData.flatMap(row => Object.keys(row))))
        .filter(Boolean)
        .filter(k => !SYNTHETIC_DISPLAY_COLUMNS.includes(k))
    : [];

  // 🆕 Members sheet ka Add form hamesha "Name" field se shuru hona chahiye
  // (kisi "Member"/MemberID jaisi column se nahi) — form fill karne mein sabse
  // pehle naam poocha jana natural hai. "Place of Origin"/"Origin" (gaon) field
  // bhi turant uske baad, upar hi dikhega — neeche scroll karke dhoondhna na pade.
  if (sheetName === "Members") {
    const nameKey = columns.find(k => k.toLowerCase() === "name");
    const originKey = columns.find(k => k !== nameKey && k.toLowerCase().includes("origin"));
    const priorityKeys = [nameKey, originKey].filter(Boolean);
    if (priorityKeys.length) {
      columns = [...priorityKeys, ...columns.filter(k => !priorityKeys.includes(k))];
    }
  }

  if (!columns.length) {
    alert("Is tab ke columns pata nahi chal paaye. Pehle sheet mein kam se kam header row hona chahiye.");
    return;
  }

  // 🆕 Popup + form TURANT dikhao — backend (Apps Script) ka wait nahi.
  // Formula-driven columns (jaise Paid Boli, Pending Dues) ka pata agar cache mein
  // hai to seedha use hota hai, warna form pehle dikh jaata hai aur backend se jawab
  // aate hi woh fields apne aap hat jaate hain (neeche dekho).
  el("editTitle").textContent = "Add New: " + sheetName;
  el("saveEditBtn").disabled = false;
  el("saveEditBtn").textContent = "Save";
  el("saveEditBtn").onclick = null; // 🆕 purane (pichhle tab/edit ka) Save handler kabhi na chale
  el("cancelEditBtn").onclick = () => { el("editPopup").style.display = "none"; };
  el("editPopup").style.display = "flex";

  let formulaColumns = (FORMULA_COLS_CACHE[sheetName] && FORMULA_COLS_CACHE[sheetName].cols) || [];
  const container = el("editFields");
  container.innerHTML = "";
  const groupByKey = {};
  const inputIds = [];
  const memberCol = SETTINGS?.MemberColumn || "Member";
  let memberSelectEl = null, forSelectEl = null, typeSelectEl = null, amountInputEl = null, mobileInputEl = null, firmInputEl = null, boliRefInputEl = null, yearInputEl = null, donationRefInputEl = null;

  columns.forEach(k => { try {
    const kl = k.toLowerCase();
    if (kl === "password" || kl === "role") return;
    if (kl === "id") return; // 🆕 ID auto-generate hoti hai, Add form mein dikhane ki zaroorat nahi
    if (/^commitments?$/.test(kl.trim())) return; // 🆕 📅 वादा popup se manage hota hai
    // 🆕 Members sheet mein "Member" naam ka column khud member ke record ke andar
    // bekaar/duplicate hai (Name column already hai) — Add Member form mein isse
    // bilkul mat dikhao.
    if (sheetName === "Members" && kl === "member") return;
    if (formulaColumns.includes(k)) return; // 🆕 formula-driven column — Add form mein nahi dikhana
    const id = "af_" + k.replace(/\s+/g, "_");
    inputIds.push({ key: k, id });
    const label = document.createElement("label"); label.textContent = k;

    const { el: input, isTextarea, recentValues } = buildSmartField_(k, "");
    input.id = id;
    if (isDateField_(k)) {
      // 🆕 Native date-picker (calendar se select karo), sheet format DD/MM/YYYY mein save hoga
      if (input.tagName !== "SELECT") {
        input.type = "date";
        // 🆕 Main transaction "Date" aur Members ka "Joined"/"Joining Date" — dono
        // Add karte waqt current date se auto-fill honge (Birthday/DOB/Anniversary
        // jaanbujhkar chhode hain, kyunki wo kabhi "aaj" nahi ho sakti).
        if (kl === "date" || kl.includes("joined") || kl.includes("joining")) {
          input.value = isoToday_();
        }
      }
    } else if (input.tagName !== "SELECT") {
      const hint = samplePlaceholder_(k);
      if (hint) input.placeholder = hint; // 🆕 sample text
    }
    // 🆕 Members Add form mein "Status" hamesha "Approve" se pre-select rahe —
    // admin khud se member add kare to usko approval ke liye alag se click na
    // karna pade (naya self-registration abhi bhi "Pending" hi rahega, woh
    // newRegistration() function se aata hai, is form se nahi).
    if (sheetName === "Members" && kl === "status" && input.tagName === "SELECT") {
      setSelectValueSafe_(input, "Approve");
    } else if (sheetName === "Members" && kl === "status" && !input.value) {
      // 🆕 Bilkul khaali sheet (abhi tak koi bhi status value hi nahi hai) mein
      // dropdown ke bajaye plain input ban jaata hai — wahan bhi default bhar do
      input.value = "Approve";
    }
    const group = document.createElement("div");
    if (isTextarea) group.style.gridColumn = "1 / -1";
    group.appendChild(label);
    group.appendChild(input);
    container.appendChild(group);
    groupByKey[k] = group;
    if (input.tagName === "SELECT") attachOtherToggle_(input, group, k);
    if (input.tagName === "TEXTAREA" && recentValues) attachRecallDropdown_(input, group, recentValues);
    if (sheetName === "Meetings" && input.tagName === "TEXTAREA" && /detail|agenda/i.test(k)) attachAgendaPicker_(input, group); // 🆕

    // Receipts ke liye Boli/Donation auto-fetch hetu references save karo
    if (sheetName === "Receipts") {
      if (k === memberCol || kl === "member") memberSelectEl = input;
      if (kl === "for") forSelectEl = input;
      if (kl === "type") typeSelectEl = input;
      if (kl === "received" || kl.includes("amount")) amountInputEl = input;
      if (kl.includes("mobile")) mobileInputEl = input;
      if (kl.includes("boli")) boliRefInputEl = input; // 🆕 "Boli ID"/"Boli Ref" column
      if (kl.includes("donation")) donationRefInputEl = input; // 🆕 "Donation ID"/"Donation Ref" column
      if (kl === "year") yearInputEl = input; // 🆕
    }
    // Boli/Donation ke liye Firm Name auto-fetch hetu references
    if (sheetName === "Boli" || sheetName === "Donation") {
      if (k === memberCol || kl === "member") memberSelectEl = input;
      if (kl.includes("firm")) firmInputEl = input;
      if (kl.includes("mobile")) mobileInputEl = input; // 🆕 Boli/Donation mein bhi Mobile auto-fetch
    }
    // 🆕 Expenses mein bhi Member select karne par Mobile auto-fetch (agar Member field hai)
    if (sheetName === "Expenses") {
      if (k === memberCol || kl === "member") memberSelectEl = input;
      if (kl.includes("mobile")) mobileInputEl = input;
    }
  } catch (fieldErr) { console.error("Add form field error:", k, fieldErr); } }); // 🆕 ek field ki gadbad poore form ko na roke

  // 🆕 Backend se formula-driven columns ka pata chalte hi unhe form se hata do
  getFormulaColumnsCached_(sheetName).then(cols => {
    (cols || []).forEach(c => {
      const g = groupByKey[c];
      if (g && g.parentNode) g.parentNode.removeChild(g);
    });
  }).catch(() => {});

  // 🆕 Members Add form mein "Role" field ko user ko dikhana nahi hai (hamesha
  // "Member" hi hoga — Admin/other roles ke liye sheet mein khud change karo),
  // par pehle poora field hi skip ho jaata tha, isliye Role column HAMESHA
  // KHAALI save hota tha. Ab ek chhupa hua (hidden) input daal rahe hain jisse
  // yeh hamesha "Member" save ho, bina form mein dikhe.
  if (sheetName === "Members") {
    const roleKey = columns.find(c => c.toLowerCase() === "role");
    if (roleKey) {
      const hiddenRole = document.createElement("input");
      hiddenRole.type = "hidden";
      hiddenRole.id = "af_" + roleKey.replace(/\s+/g, "_");
      hiddenRole.value = "Member";
      container.appendChild(hiddenRole);
      inputIds.push({ key: roleKey, id: hiddenRole.id });
    }
  }

  // 🆕 Expenses (aur koi bhi tab jisme sirf Mobile chahiye): Member select karte hi Mobile auto-fill
  if (sheetName === "Expenses" && memberSelectEl && mobileInputEl) {
    (async () => {
      const membersRows = await fetchSheet("Members");
      const mobileByName = {};
      membersRows.forEach(r => {
        const name = r[memberCol] || r["Member"] || "";
        if (!name) return;
        mobileByName[name] = r[SETTINGS?.MobileColumn] || r["Mobile"] || "";
      });
      memberSelectEl.addEventListener("change", () => {
        const name = memberSelectEl.value;
        if (name && mobileByName[name] !== undefined) mobileInputEl.value = mobileByName[name];
      });
    })();
  }

  // 🆕 Boli/Donation mein: Member select karte hi Firm Name + Mobile auto-fill (Members sheet se)
  if ((sheetName === "Boli" || sheetName === "Donation") && memberSelectEl && (firmInputEl || mobileInputEl)) {
    (async () => {
      const membersRows = await fetchSheet("Members");
      const firmByName = {}, mobileByName = {};
      membersRows.forEach(r => {
        const name = r[memberCol] || r["Member"] || "";
        if (!name) return;
        // 🆕 Members sheet mein alag se "Firm" column nahi hota — Firm/Business ka naam
        // "Occupation" column mein hi likha jaata hai, isliye wahi fallback ke roop mein lo
        const firmKey = Object.keys(r).find(kk => kk.toLowerCase().includes("firm")) ||
                        Object.keys(r).find(kk => kk.toLowerCase() === "occupation");
        if (firmKey) firmByName[name] = r[firmKey] || "";
        mobileByName[name] = r[SETTINGS?.MobileColumn] || r["Mobile"] || "";
      });
      memberSelectEl.addEventListener("change", () => {
        const name = memberSelectEl.value;
        if (!name) return;
        if (isAnonMember_(name)) { // 🆕 "सहयोग राशि" — koi firm/mobile nahi, naam Notes mein
          if (firmInputEl) firmInputEl.value = "";
          if (mobileInputEl) mobileInputEl.value = "";
          hintNotesForAnon_();
          return;
        }
        if (firmInputEl && firmByName[name] !== undefined) firmInputEl.value = firmByName[name];
        if (mobileInputEl && mobileByName[name] !== undefined) mobileInputEl.value = mobileByName[name];
      });
    })();
  }

  // 🆕 Receipts mein: Member select karte hi Boli/Donation ka Mobile, For, Balance sab auto-fill.
  // Agar member ke EK SE ZYADA bakaya Boli/Donation pledge hain (chahe alag-alag Boli, ya
  // Boli + Donation dono), to ek chooser dropdown dikhao jisse sahi wali chuni ja sake —
  // pehle sirf sabse bada wala auto-select ho jaata tha, baaki sab ignore ho jaate the.
  if (sheetName === "Receipts" && memberSelectEl) {
    (async () => {
      const [boliRows, donationRows] = await Promise.all([
        fetchSheet("Boli"), fetchSheet("Donation")
      ]);
      const info = {}; // name -> {mobile, boliPledges:[{id,pending,forText,year}], donationPledges:[{id,pending,forText,year}]}

      boliRows.forEach(r => {
        const name = r[memberCol] || r["Member"] || "";
        if (!name) return;
        if (!info[name]) info[name] = { mobile: "", boliPledges: [], donationPledges: [] };
        const pending = toNumber(r["Pledged Boli"]) - toNumber(r["Paid Boli"]);
        info[name].boliPledges.push({ id: r["ID"] || "", pending, forText: r["For"] || "", year: r["Year"] || "" });
        info[name].mobile = info[name].mobile || r[SETTINGS?.MobileColumn] || r["Mobile"] || "";
      });
      donationRows.forEach(r => {
        const name = r[memberCol] || r["Member"] || "";
        if (!name) return;
        if (!info[name]) info[name] = { mobile: "", boliPledges: [], donationPledges: [] };
        // 🆕 Donation ab Boli jaisa — har pledge apna alag ID ke saath, taaki
        // ek hi member ke MULTIPLE donations ho to sahi se alag track ho
        const pending = toNumber(r["Pledged Donation"]) - toNumber(r["Paid Donation"]);
        info[name].donationPledges.push({ id: r["ID"] || "", pending, forText: r["For"] || "", year: r["Year"] || "" });
        info[name].mobile = info[name].mobile || r[SETTINGS?.MobileColumn] || r["Mobile"] || "";
      });

      // 🆕 Chooser dropdown banao aur Member field ke turant baad form mein daalo
      const pledgeGroup = document.createElement("div");
      pledgeGroup.style.display = "none";
      const pledgeLabel = document.createElement("label");
      pledgeLabel.textContent = "किस बोली/दान के लिए (Which pledge)";
      const pledgeSelectEl = document.createElement("select");
      pledgeSelectEl.className = "smart-select";
      pledgeGroup.appendChild(pledgeLabel);
      pledgeGroup.appendChild(pledgeSelectEl);
      if (memberSelectEl.parentNode && memberSelectEl.parentNode.parentNode === container) {
        memberSelectEl.parentNode.insertAdjacentElement("afterend", pledgeGroup);
      } else {
        container.insertBefore(pledgeGroup, container.firstChild);
      }

      const applyPledge_ = (kind, pledge) => {
        if (!pledge) return;
        setSelectValueSafe_(typeSelectEl, kind === "boli" ? "Boli" : "Donation");
        setSelectValueSafe_(forSelectEl, pledge.forText);
        if (amountInputEl) amountInputEl.value = Math.max(0, pledge.pending);
        if (kind === "boli") {
          // 🆕 Sabse zaroori: us specific pledge ka ID Receipts ke linking column mein bharo,
          // warna Boli/Donation sheet ka SUMIFS formula is payment ko count hi nahi karega
          if (boliRefInputEl) setSelectValueSafe_(boliRefInputEl, pledge.id);
          if (donationRefInputEl && donationRefInputEl.tagName !== "SELECT") donationRefInputEl.value = "";
          else if (donationRefInputEl) donationRefInputEl.value = "";
        } else {
          if (donationRefInputEl) setSelectValueSafe_(donationRefInputEl, pledge.id);
          if (boliRefInputEl && boliRefInputEl.tagName !== "SELECT") boliRefInputEl.value = "";
          else if (boliRefInputEl) boliRefInputEl.value = "";
        }
        if (yearInputEl) setSelectValueSafe_(yearInputEl, pledge.year);
      };

      const updateFromMember = () => {
        const name = memberSelectEl.value;
        pledgeSelectEl.innerHTML = "";
        pledgeGroup.style.display = "none";
        if (isAnonMember_(name)) { if (mobileInputEl) mobileInputEl.value = ""; hintNotesForAnon_(); } // 🆕
        if (!name || !info[name]) return;
        const rec = info[name];

        if (mobileInputEl) mobileInputEl.value = rec.mobile || "";

        // 🆕 Is member ke SAARE bakaya (pending > 0) Boli + Donation pledges ikattha karo
        const pending = [
          ...rec.boliPledges.filter(p => p.pending > 0).map(p => ({ kind: "boli", pledge: p })),
          ...rec.donationPledges.filter(p => p.pending > 0).map(p => ({ kind: "donation", pledge: p }))
        ];

        if (!pending.length) return; // koi bakaya nahi — user manually Type/For/Amount bharega

        pending.forEach((item, idx) => {
          const { kind, pledge } = item;
          const label =
            (kind === "boli" ? "बोली" : "दान") +
            " — ₹" + pledge.pending +
            (pledge.forText ? " (" + pledge.forText + ")" : "") +

// DD/MM/YYYY (ya Date object/ISO) ko JS Date mein convert karo — filter ke liye
function parseRowDate_(val) {
  if (!val) return null;
  if (val instanceof Date) return isNaN(val) ? null : val;
  // Google Sheets serial date number (jaise 46601 = kisi din ki serial value)
  if (typeof val === "number" && val > 20000 && val < 80000) {
    const epoch = new Date(1899, 11, 30);
    const d = new Date(epoch.getTime() + val * 86400000);
    return isNaN(d) ? null : d;
  }
  const s = String(val).trim();
  const m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if (m) return new Date(+m[3], +m[2] - 1, +m[1]);
  const d = new Date(s);
  return isNaN(d) ? null : d;
}

// Year ya FY dropdown ke liye, tableData se available years nikalo
// (Date column se, ya Year column se fallback)
function getAvailableYears_(data) {
  const years = new Set();
  data.forEach(r => {
    if (!r) return;
    const d = parseRowDate_(r["Date"]);
    if (d) { years.add(d.getFullYear()); return; }
    const y = r["Year"] || r["year"];
    if (y) years.add(parseInt(y, 10));
  });
  let result = [...years].filter(y => !isNaN(y)).sort((a, b) => b - a);
  // 🆕 Agar data se koi bhi saal nahi mila (khaali tab, ya Date/Year format alag),
  // to bhi dropdown khaali na rahe — current + pichle 4 saal fallback ke roop mein do
  if (!result.length) {
    const cy = new Date().getFullYear();
    result = [cy, cy - 1, cy - 2, cy - 3, cy - 4];
  }
  return result;
}

function fillYearFilter(data) {
  const years = getAvailableYears_(data);
  const currentYear = new Date().getFullYear();
  // 🆕 Current year hamesha list mein rahe, chahe abhi tak uska koi transaction
  // sheet mein na ho — warna dropdown mein sirf purane saal (jaise 2022) dikhte,
  // aur current year select hi nahi ho paata.
  if (!years.includes(currentYear)) years.unshift(currentYear);
  years.sort((a, b) => b - a);

  const yearSelect = document.getElementById("yearFilter");
  if (yearSelect) {
    const prev = yearSelect.value;
    yearSelect.innerHTML = `<option value="">सभी वर्ष</option>`;
    years.forEach(y => {
      const opt = document.createElement("option");
      opt.value = y; opt.textContent = y;
      yearSelect.appendChild(opt);
    });
    if (prev && years.includes(+prev)) {
      yearSelect.value = prev;
    } else if (!yearSelect.dataset.userTouched) {
      // 🆕 Sirf pehli baar (jab tak user ne khud kabhi kuch select nahi kiya) —
      // default current year rahega, "सभी वर्ष"/koi purana saal nahi.
      yearSelect.value = String(currentYear);
    }
  }

  // 🆕 Financial Year dropdown (अप्रैल–मार्च) — jaise "2024-25"
  const fySelect = document.getElementById("fyFilter");
  if (fySelect) {
    const prev = fySelect.value;
    fySelect.innerHTML = "";
    // Har saal ke liye do FY ban sakte hain (Jan-Mar wale saal ki FY pichle saal se shuru hoti hai)
    const fyStarts = new Set();
    years.forEach(y => { fyStarts.add(y); fyStarts.add(y - 1); });
    [...fyStarts].sort((a, b) => b - a).forEach(startYear => {
      const label = `FY ${startYear}-${String(startYear + 1).slice(-2)}`;
      const opt = document.createElement("option");
      opt.value = startYear; opt.textContent = label;
      fySelect.appendChild(opt);
    });
    if ([...fySelect.options].some(o => o.value === prev)) fySelect.value = prev;
  }
}

// Abhi konsa filter mode active hai, uske hisaab se {start, end} Date range do
// (null = koi filter nahi, sab data dikhao)
function getActiveDateFilterRange_() {  const mode = document.getElementById("filterMode")?.value || "all";

  if (mode === "year") {
    const y = document.getElementById("yearFilter")?.value;
    if (!y) return null;
    return { start: new Date(+y, 0, 1), end: new Date(+y, 11, 31, 23, 59, 59), year: +y };
  }

    const startYear = document.getElementById("fyFilter")?.value;
    if (!startYear) return null;

    return {
      start: new Date(+startYear, 3, 1),
      end: new Date(+startYear + 1, 2, 31, 23, 59, 59)
    };
  }

  if (mode === "custom") {

    };

}

// Row is range ke andar aata hai ya nahi — Date column se check karo, warna
// Year column se fallback (jin tabs mein poori Date nahi hai unke liye, jaise
// Boli/Donation pledge saal)
function rowInDateRange_(row, range) {
  const d = parseRowDate_(row["Date"]);
  if (d) {
    if (range.start && d < range.start) return false;
    if (range.end && d > range.end) return false;
    return true;
  }
  // Date column nahi hai (jaise Members) — Year column se match karo
  if (range.year !== undefined) {
    const y = row["Year"] || row["year"];
    if (!y) return true; // Year bhi nahi hai to filter mat karo, dikhao
    return String(parseInt(y, 10)) === String(range.year);
  }
  return true; // Date parse nahi ho payi aur FY/custom hai — safe default: dikhao
}

// 🆕 "Balance" (Fund/Cash/Bank) ke liye ALAG check — yeh "us saal ka movement"
// nahi, balki "us saal ke AAKHIR TAK ka CUMULATIVE balance" hona chahiye
// (jaise bank passbook mein "31 Dec 2024 tak balance"). Isliye sirf UPPER
// bound (range.end) check karte hain — range.start ko IGNORE karte hain,
// taaki us saal se PEHLE ki saari entries bhi ginti mein aayein.
function rowUpToPeriodEnd_(row, range) {
  if (!range || !range.end) return true; // "All"/koi end na ho — poora cumulative (ab tak)
  const d = parseRowDate_(row["Date"]);
  if (d) return d <= range.end;
  if (range.year !== undefined) {
    const y = row["Year"] || row["year"];
    if (!y) return true;
    return parseInt(y, 10) <= range.year;
  }
  return true;
}

// Tab ka "date" column dhoondo: pehle exact "Date", phir koi bhi "...date..."
// (Birthday/DOB/Anniversary chhod ke), phir Joined/Joining
function detectDateKey_(rows) {
  const keys = Array.from(new Set(rows.flatMap(r => Object.keys(r || {})))).filter(Boolean);
  const low = k => k.toLowerCase().trim();
  const notBirth = k => !/birth|dob|anniversar/.test(low(k));
  return keys.find(k => low(k) === "date")
      || keys.find(k => low(k).includes("date") && notBirth(k))
      || keys.find(k => /joined|joining/.test(low(k)))
      || null;
}

// rows ko latest-date-first order mein lautata hai (same date par sheet ki pichhli row pehle)
function sortLatestFirst_(rows, allData) {
  const dateKey = detectDateKey_(allData);
  const idx = new Map(allData.map((r, i) => [r, i]));
  const ts = r => {
    if (!dateKey) return null;
    const d = parseRowDate_(r[dateKey]);
    return d ? d.getTime() : null;
  };
  const keyed = rows.map(r => ({ r, t: ts(r), i: idx.has(r) ? idx.get(r) : -1 }));
  keyed.sort((a, b) => {
    if (a.t !== null && b.t !== null) {
      if (a.t !== b.t) return b.t - a.t;
      return b.i - a.i;
    }
    if (a.t === null && b.t !== null) return 1;   // bina date wali rows neeche
    if (a.t !== null && b.t === null) return -1;
    return b.i - a.i;
  });
  return keyed.map(k => k.r);
}

  return "txt";
}

  if (crudCfg && crudCfg.allowEditDelete) {
    if (actions.includes("EDIT")) {
      html += `<a class="action-link edit" href="#" onclick="openEditRecord('${encId}', event)">Edit</a>`;
    }
    if (actions.includes("DELETE")) {
      html += `<a class="action-link delete" href="#" onclick="deleteRecord('${encId}', event)">Delete</a>`;
    }
  }
  if ((currentTab === "Boli" || currentTab === "Donation") && actions.includes("EDIT")) {
    html += `<a class="action-link edit" href="#" onclick="openCommitments('${encId}', event)">📅 वादा</a>`;
  }
  if (currentTab === "Meetings" && actions.includes("EDIT")) {
    html += `<a class="action-link edit" href="#" onclick="openAttendance_('${encId}', event)">👥 उपस्थिति</a>`;
  }
  if (["Members", "Boli", "Donation", "Receipts"].includes(currentTab)) {
    const _nm = getRowMemberName_(row);
    if (_nm && !isAnonMember_(_nm)) {
      html += `<a class="action-link print" href="#" onclick="openMemberStatement_('${encodeURIComponent(_nm).replace(/'/g, "%27")}', event)">📄 खाता</a>`;
    }
  }
  if (actions.includes("WHATSAPP")) {
    let mobile = row[SETTINGS?.MobileColumn] || row["Mobile"] || "";
    mobile = mobile.replace(/\D/g, ""); // remove any non-digit characters
    // Auto prepend country code if missing (optional)
    const defaultCountryCode = SETTINGS?.DefaultCountryCode || "91";
    if(mobile.length === 10){ 
      mobile = defaultCountryCode + mobile; 
    }
    const message = getMessageFromTemplate(currentTab, row) || "";
    const waUrl = (SETTINGS?.WhatsAppBaseURL || "https://api.whatsapp.com/send?phone={{Mobile}}&text={{Message}}")
      .replace("{{Mobile}}", encodeURIComponent(mobile))
      .replace("{{Message}}", encodeURIComponent(message));
    html += `<a class="action-link whatsapp" target="_blank" href="${waUrl}">WhatsApp</a>`;
  }
  html += `</div>`;
  // 🆕 v1.226: mobile par buttons 2 line mein — columns = ceil(buttons / 2)
  const _acN = (html.match(/class="action-link/g) || []).length;
  html = html.replace('<div class="action-wrap">', '<div class="action-wrap" style="--ac:' + Math.max(1, Math.ceil(_acN / 2)) + '">');
  return html;
}

/* ===========================
   📅 वादा / Expected Date — ek record ke liye MULTIPLE dates + remarks
   Sheet (Boli / Donation) mein "Commitments" naam ka column chahiye.
   Har line: DD/MM/YYYY | amount | remark
   =========================== */
function openCommitments(incomingEnc, e) {
  if (e && e.preventDefault) e.preventDefault();
  const incoming = decodeURIComponent(incomingEnc || "");
  const recIndex = tableData.findIndex(r => (resolveRecordId_(r).recordId || "") === incoming);
  if (recIndex === -1) { alert("रिकॉर्ड नहीं मिला।"); return; }
  const rec = tableData[recIndex];
  // OpenSheet khaali last-column wali cell row se hata deta hai, isliye key row mein na dikhe
  // to bhi column maan lo — agar sheet mein sach mein nahi hoga to save par saaf error aayega
  const key = getCommitmentKey_(rec) ||
              (tableData.map(getCommitmentKey_).find(Boolean)) ||
              "Commitments";
  const { idColumn, recordId } = resolveRecordId_(rec);
  if (!idColumn) { alert("इस sheet में 'ID' column नहीं मिला।"); return; }

  let list = parseCommitments_(rec[key]);
  const esc = t => String(t || "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const memberName = rec[SETTINGS?.MemberColumn] || rec["Member"] || "";

  el("editTitle").textContent = "📅 वादा / Expected Date — " + memberName;
  const box = el("editFields");
  box.innerHTML = `
    <div style="grid-column:1 / -1">
      <div id="cmSummary" style="background:#fff8e6;border:1px solid #f0d58a;border-radius:8px;padding:8px 10px;font-size:13px;margin-bottom:8px;display:none"></div>
      <div id="cmList"></div>
      <div style="margin-top:10px;padding:10px;border:1px dashed #bbb;border-radius:8px;display:grid;gap:8px;">
        <b style="font-size:13px">➕ नया वादा जोड़ें</b>
        <input type="date" id="cmDate">
        <input type="number" id="cmAmt" placeholder="राशि (optional)" inputmode="numeric">
        <input type="text" id="cmRemark" placeholder="Remark (जैसे: बेटे की शादी के बाद देंगे)">
        <button type="button" id="cmAddBtn" style="background:#1a9c4b;color:#fff;border:none;padding:8px;border-radius:6px;">जोड़ें</button>
      </div>
    </div>`;

  const pending = getPendingAmount_(rec); // sheet ka Pending/Balance/Due column
  const inr = n => "₹" + Number(n).toLocaleString("en-IN");
  const updateSummary = () => {
    const sm = document.getElementById("cmSummary");
    if (!sm) return;
    if (!pending) { sm.style.display = "none"; return; }
    const committed = list.reduce((a, c) => a + toNumber(c.amount), 0);
    let t = "💰 <b>बाकी राशि: " + inr(pending) + "</b>";
    if (committed > 0) {
      const left = pending - committed;
      t += " &nbsp;•&nbsp; वादे में: " + inr(committed) +
           " &nbsp;•&nbsp; " + (left >= 0 ? "वादे के बिना बाकी: <b>" + inr(left) + "</b>"
                                         : "<span style='color:#b00'>वादा बाकी राशि से ₹" + Number(-left).toLocaleString("en-IN") + " ज़्यादा है</span>");
    }
    sm.innerHTML = t;
    sm.style.display = "";
    const amt = document.getElementById("cmAmt");
    if (amt && !amt.value) {
      const remaining = pending - committed;
      if (remaining > 0) amt.value = remaining; // naye वादे mein bachi hui raashi pehle se bhar do
    }
  };
  const draw = () => {
    updateSummary();
    const holder = document.getElementById("cmList");
    if (!list.length) { holder.innerHTML = "<p class='muted'>अभी कोई वादा दर्ज नहीं है।</p>"; return; }
    holder.innerHTML = list.map((c, i) => `
      <div style="display:flex;gap:8px;align-items:flex-start;justify-content:space-between;border-bottom:1px solid #eee;padding:6px 0;">
        <div style="font-size:13px"><b>${esc(c.date)}</b>${c.amount ? " — ₹" + esc(c.amount) : ""}<br>${esc(c.remark)}</div>
        <button type="button" data-i="${i}" class="cmDel" style="background:#fff;border:1px solid #e0a0a0;color:#b00;border-radius:6px;padding:2px 8px;">✕</button>
      </div>`).join("");
    holder.querySelectorAll(".cmDel").forEach(b => b.onclick = () => { list.splice(+b.dataset.i, 1); draw(); });
  };
  draw();

  document.getElementById("cmAddBtn").onclick = () => {
    const d = isoToDDMMYYYY_(document.getElementById("cmDate").value);
    if (!d) { alert("वादे की तारीख चुनें।"); return; }
    list.push({
      date: d,
      amount: document.getElementById("cmAmt").value.trim(),
      remark: document.getElementById("cmRemark").value.trim()
    });
    document.getElementById("cmDate").value = "";
    document.getElementById("cmAmt").value = "";
    document.getElementById("cmRemark").value = "";
    draw();
  };

  el("saveEditBtn").disabled = false;
  el("saveEditBtn").textContent = "Save";
  el("cancelEditBtn").onclick = () => { el("editPopup").style.display = "none"; };
  el("saveEditBtn").onclick = async () => {
    el("saveEditBtn").disabled = true;
    el("saveEditBtn").textContent = "Saving...";
    try {
      const text = serializeCommitments_(list);
      const res = await callCrudBackend_({
        action: "editRow", sheetName: currentTab, idColumn, id: recordId, data: { [key]: text }
      });
      if (res.success) {
        rec[key] = text;
        delete CACHE[currentTab];
        el("editPopup").style.display = "none";
        try { renderTable(); } catch (x) { console.error(x); }
        alert("वादा Google Sheet में save हो गया है।");
      } else {
        alert("❌ Error: " + (res.msg || "Save nahi ho paya") +
              "\n\n(Column ka naam sheet mein bilkul '" + key + "' hona chahiye)");
      }
    } catch (err) {
      console.error(err);
      alert("❌ " + (err.message || "Network error, dobara try karein"));
    } finally {
      el("saveEditBtn").disabled = false;
      el("saveEditBtn").textContent = "Save";
    }
  };
  el("editPopup").style.display = "flex";
}

/* ===========================
   📅 वादा FILTER (Boli / Donation)
   =========================== */
let commitFilter = "";
let commitFilterInit_ = ""; // kis tab ke liye default filter lag chuka hai
let lastFilteredRows_ = [];

function commitInfo_(row) {
  const list = parseCommitments_(row[getCommitmentKey_(row)] || "");
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const diffs = list.map(c => {
    const d = parseRowDate_(c.date);
    return d ? Math.round((new Date(d.getFullYear(), d.getMonth(), d.getDate()) - today) / 86400000) : null;
  }).filter(v => v !== null);
  return { list, diffs, pending: getPendingAmount_(row) };
}
function hasPendingInfo_(row) {
  const keys = Object.keys(row || {});
  return keys.some(x => /pending|\bdue\b|baki|bakaya|बाकी|शेष|balance/i.test(x)) ||
         (keys.some(x => /^pledged/i.test(x.trim())) && keys.some(x => /^paid/i.test(x.trim())));
}
// वादा-wali rows ka order: aaj/aane wale (sabse paas wali date pehle) → nikle hue → bina वादा
function commitSortRank_(row) {
  const { diffs } = commitInfo_(row);
  if (!diffs.length) return [2, 0];
  const upcoming = diffs.filter(d => d >= 0);
  if (upcoming.length) return [0, Math.min(...upcoming)];
  return [1, -Math.max(...diffs)]; // nikle hue: sabse haal ka (kam purana) pehle
}
function matchCommitFilter_(row, mode) {
  const { list, diffs, pending } = commitInfo_(row);
  switch (mode) {
    case "pending":  return hasPendingInfo_(row) ? pending > 0 : true;
    case "today":    return diffs.some(d => d === 0);
    case "tomorrow": return diffs.some(d => d === 1);
    case "week":     return diffs.some(d => d >= 0 && d <= 7);
    case "overdue":  return pending > 0 && diffs.length > 0 && diffs.every(d => d < 0);
    case "none":     return pending > 0 && list.length === 0;
    default: return true;
  }
}
function setCommitFilter_(v) {
  commitFilter = v || "";
  currentPage = 1;
  renderTable();
}
function updateCommitToolbar_(sheetName) {
  const on = (sheetName === "Boli" || sheetName === "Donation");
  if (!on) commitFilterInit_ = "";
  else if (commitFilterInit_ !== sheetName) { commitFilter = "pending"; commitFilterInit_ = sheetName; } // 🆕 default: बाकी + वादा वाले ऊपर
  const sel = document.getElementById("commitFilter");
  const bulk = document.getElementById("bulkRemBtn");
  if (sel) { sel.style.display = on ? "inline-block" : "none"; sel.value = on ? commitFilter : ""; }
  const canWa = (ROLE_ACCESS?.[currentUser?.role]?.[sheetName]?.canAction || []).includes("WHATSAPP");
  if (bulk) bulk.style.display = (on && canWa) ? "inline-block" : "none";
}
function openCommitView_(sheetName, mode) {
  setActiveTab(sheetName);
  commitFilter = mode || "pending";
  commitFilterInit_ = sheetName; // default filter isse override na ho
}

/* ===========================
   📨 BULK REMINDERS — filter ki hui list ko ek ke baad ek WhatsApp
   =========================== */
function openBulkReminders_() {
  if (currentTab !== "Boli" && currentTab !== "Donation") return;
  const all = lastFilteredRows_ || [];
  const items = all.filter(r => getPendingAmount_(r) > 0 && getRowMobile_(r));
  const skipped = all.filter(r => getPendingAmount_(r) > 0 && !getRowMobile_(r)).length;
  const m = openModal_("📨 Reminders — " + currentTab);
  if (!items.length) {
    m.body.innerHTML = "<p class='muted'>इस list में किसी का भी बाकी + mobile नहीं मिला।</p>";
    m.foot.appendChild(modalBtn_("बंद करें", "#64748b", m.close));
    return;
  }
  const done = new Set();
  const info = document.createElement("div");
  info.style.cssText = "margin-bottom:10px;font-size:13px;color:#475569;";
  const list = document.createElement("div");
  m.body.appendChild(info); m.body.appendChild(list);

  const refresh = () => {
    info.textContent = "भेजे गए: " + done.size + " / " + items.length +
      (skipped ? "  •  mobile नहीं होने से छूटे: " + skipped : "") +
      (commitFilter ? "  •  filter चालू है" : "");
  };
  const send = (i) => {
    const r = items[i];
    window.open(buildWaUrl_(getRowMobile_(r), getMessageFromTemplate(currentTab, r) || ""), "_blank");
    done.add(i); rowEls[i].style.opacity = ".5"; rowEls[i].querySelector(".tick").textContent = "✔";
    refresh();
  };
  const rowEls = items.map((r, i) => {
    const ci = commitInfo_(r);
    const nc = latestCommitment_(ci.list);
    const d = document.createElement("div");
    d.style.cssText = "display:flex;gap:10px;align-items:center;justify-content:space-between;border-bottom:1px solid #eee;padding:8px 0;";
    d.innerHTML = `<div style="font-size:13px;min-width:0"><b>${escHtml_(getRowMemberName_(r))}</b> — ₹${ci.pending.toLocaleString("en-IN")}` +
      (nc ? `<br><span style="color:#64748b">${escHtml_(formatCommitmentLine_(nc))}</span>` : "") + `</div>
      <div style="display:flex;gap:8px;align-items:center"><span class="tick" style="color:#1a9c4b;font-weight:700"></span></div>`;
    const b = modalBtn_("WhatsApp", "#25a244", () => send(i));
    d.lastElementChild.appendChild(b);
    list.appendChild(d);
    return d;
  });
  refresh();
  m.foot.appendChild(modalBtn_("▶ अगला भेजें", "#1a9c4b", () => {
    const i = items.findIndex((_, k) => !done.has(k));
    if (i === -1) { alert("सब को भेज दिया गया है।"); return; }
    rowEls[i].scrollIntoView({ block: "center" });
    send(i);
  }));
  m.foot.appendChild(modalBtn_("बंद करें", "#64748b", m.close));
}

/* ===========================
   📄 MEMBER KA KHAATA (Boli + Donation + Receipts)
   =========================== */
async function openMemberStatement_(encName, e) {
  if (e && e.preventDefault) e.preventDefault();
  const name = decodeURIComponent(encName || "").trim();
  if (!name) return;
  const m = openModal_("📄 खाता — " + name);
  m.body.innerHTML = "<p class='muted'>⏳ Loading Data...</p>";
  try {
    const [boli, don, rec] = await Promise.all([fetchSheet("Boli"), fetchSheet("Donation"), fetchSheet("Receipts")]);
    const mine = rows => rows.filter(r => getRowMemberName_(r) === name);
    const B = mine(boli), D = mine(don), R = mine(rec);
    const sum = (rows, re) => rows.reduce((a, r) => {
      const k = Object.keys(r).find(x => re.test(x.trim()));
      return a + (k ? toNumber(r[k]) : 0);
    }, 0);
    const bPl = sum(B, /^pledged/i), bPd = sum(B, /^paid/i);
    const dPl = sum(D, /^pledged/i), dPd = sum(D, /^paid/i);
    const rcv = sum(R, /^received$/i);
    const bPend = B.reduce((a, r) => a + getPendingAmount_(r), 0);
    const dPend = D.reduce((a, r) => a + getPendingAmount_(r), 0);
    const totalPend = bPend + dPend;
    const inr = n => "₹" + Number(n).toLocaleString("en-IN");

    const skip = /^(id|memberid|member|name|mobile|password|role|commitments?|showonhome)$/i;
    const pref = /date|year|for|detail|pledged|paid|pending|amount|received|mode|remark|note|type/i;
    const tableFor = (title, rows) => {
      if (!rows.length) return `<h4 style="margin:14px 0 4px">${title}</h4><p class="muted">कोई रिकॉर्ड नहीं।</p>`;
      const cols = Object.keys(rows[0]).filter(k => k && !skip.test(k.trim()) && pref.test(k)).slice(0, 7);
      return `<h4 style="margin:14px 0 4px">${title}</h4><div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:12.5px">
        <thead><tr>${cols.map(c => `<th style="border:1px solid #ddd;padding:5px;background:#f4f6f9;text-align:left">${escHtml_(c)}</th>`).join("")}</tr></thead>
        <tbody>${rows.map(r => `<tr>${cols.map(c => `<td style="border:1px solid #ddd;padding:5px">${escHtml_(r[c])}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
    };

    const summary = `
      <div style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:10px 12px;font-size:13.5px;line-height:1.8">
        <div>🔔 <b>बोली:</b> कुल ${inr(bPl)} • जमा ${inr(bPd)} • बाकी ${inr(bPend)}</div>
        <div>🤝 <b>दान / सहयोग:</b> कुल ${inr(dPl)} • जमा ${inr(dPd)} • बाकी ${inr(dPend)}</div>
        <div>🧾 <b>Receipts में कुल प्राप्त:</b> ${inr(rcv)}</div>
        <div style="font-size:15px;margin-top:4px">💰 <b>कुल बाकी: ${inr(totalPend)}</b></div>
      </div>`;
    m.body.innerHTML = summary + tableFor("🔔 बोली", B) + tableFor("🤝 दान / सहयोग", D) + tableFor("🧾 Receipts", R);

    const mobile = getUserMobileFromMembers(name) || getRowMobile_(B[0] || D[0] || R[0] || {});
    const waText = () => {
      const lines = [
        "🙏 जय श्रीयादे माता की " + name + " जी!", "",
        "📄 *आपका खाता* (" + new Date().toLocaleDateString("en-GB") + ")", "",
        "🔔 बोली: कुल " + inr(bPl) + " | जमा " + inr(bPd) + " | बाकी " + inr(bPend),
        "🤝 दान/सहयोग: कुल " + inr(dPl) + " | जमा " + inr(dPd) + " | बाकी " + inr(dPend),
        "🧾 कुल प्राप्त: " + inr(rcv), "",
        "💰 *कुल बाकी: " + inr(totalPend) + "*"
      ];
      if (totalPend > 0) lines.push("", buildBankBlock_({ ID: name, "Pending Dues": totalPend }));
      lines.push("", "*श्री मेवाड़ प्रजापत समाज, वापी*", "*जय श्रीयादे माता की!* 🙏");
      return lines.join("\n");
    };
    m.foot.appendChild(modalBtn_("💬 WhatsApp", "#25a244", () => {
      window.open(buildWaUrl_(mobile, waText()), "_blank");
    }));
    m.foot.appendChild(modalBtn_("🖨 Print", "#2563eb", () => {
      const w = window.open("", "_blank");
      if (!w) { alert("Pop-up block है — allow करें।"); return; }
      w.document.write(`<html><head><meta charset="utf-8"><title>खाता - ${escHtml_(name)}</title>
        <style>body{font-family:system-ui,sans-serif;padding:20px}h2,h3{text-align:center;margin:4px}</style></head><body>
        <h2>श्री मेवाड़ प्रजापत समाज, वापी</h2><h3>खाता विवरण — ${escHtml_(name)}</h3>
        <p style="text-align:center">दिनांक: ${new Date().toLocaleDateString("en-GB")}</p>${m.body.innerHTML}</body></html>`);
      w.document.close(); w.focus(); setTimeout(() => w.print(), 400);
    }));
    m.foot.appendChild(modalBtn_("बंद करें", "#64748b", m.close));
  } catch (err) {
    console.error(err);
    m.body.innerHTML = "<p>❌ खाता load नहीं हो पाया।</p>";
  }
}

/* ===========================
   👥 MEETING UPASTHITI (attendance) — Meetings sheet mein "Attendance" column chahiye
   =========================== */
function openAttendance_(incomingEnc, e) {
  if (e && e.preventDefault) e.preventDefault();
  const incoming = decodeURIComponent(incomingEnc || "");
  const recIndex = tableData.findIndex(r => (resolveRecordId_(r).recordId || "") === incoming);
  if (recIndex === -1) { alert("रिकॉर्ड नहीं मिला।"); return; }
  const rec = tableData[recIndex];
  const key = Object.keys(rec).find(k => /^attendance$/i.test(k.trim())) ||
              tableData.map(r => Object.keys(r).find(k => /^attendance$/i.test(k.trim()))).find(Boolean) ||
              "Attendance";
  const { idColumn, recordId } = resolveRecordId_(rec);
  if (!idColumn) { alert("इस sheet में 'ID' column नहीं मिला।"); return; }

  const memberCol = SETTINGS?.MemberColumn || "Member";
  const allNames = [...new Set(Object.values(MEMBERS || {}).map(r => String(r[memberCol] || r["Member"] || "").trim()).filter(Boolean))]
    .sort((a, b) => a.localeCompare(b, "hi"));
  const present = new Set(String(rec[key] || "").split(/[,\n]/).map(x => x.trim()).filter(Boolean));
  [...present].forEach(n => { if (!allNames.includes(n)) allNames.push(n); }); // purane guest naam bhi dikhen

  const m = openModal_("👥 उपस्थिति — " + (rec["Date"] || "Meeting"));
  const cnt = document.createElement("div");
  cnt.style.cssText = "font-weight:700;margin-bottom:8px;";
  const search = document.createElement("input");
  search.type = "text"; search.placeholder = "🔍 नाम खोजें";
  search.style.cssText = "width:100%;padding:8px;border:1px solid #ccc;border-radius:8px;margin-bottom:8px;box-sizing:border-box;";
  const guestRow = document.createElement("div");
  guestRow.style.cssText = "display:flex;gap:8px;margin-bottom:8px;";
  const guest = document.createElement("input");
  guest.type = "text"; guest.placeholder = "अतिथि / बाहर का नाम जोड़ें";
  guest.style.cssText = "flex:1;padding:8px;border:1px solid #ccc;border-radius:8px;box-sizing:border-box;";
  guestRow.appendChild(guest);
  const list = document.createElement("div");
  m.body.appendChild(cnt); m.body.appendChild(search); m.body.appendChild(guestRow); m.body.appendChild(list);

  const updCount = () => { cnt.textContent = "उपस्थित: " + present.size + " / " + allNames.length; };
  const draw = () => {
    const q = search.value.trim().toLowerCase();
    list.innerHTML = "";
    allNames.filter(n => !q || n.toLowerCase().includes(q)).forEach(n => {
      const lab = document.createElement("label");
      lab.style.cssText = "display:flex;align-items:center;gap:10px;padding:6px 2px;border-bottom:1px solid #f0f0f0;font-size:14px;cursor:pointer;margin:0;font-weight:400;";
      const cb = document.createElement("input");
      cb.type = "checkbox"; cb.checked = present.has(n);
      cb.style.cssText = "width:18px;height:18px;margin:0;padding:0;";
      cb.onchange = () => { cb.checked ? present.add(n) : present.delete(n); updCount(); };
      const sp = document.createElement("span"); sp.textContent = n;
      lab.appendChild(cb); lab.appendChild(sp); list.appendChild(lab);
    });
  };
  search.oninput = draw;
  guestRow.appendChild(modalBtn_("जोड़ें", "#2563eb", () => {
    const g = guest.value.trim();
    if (!g) return;
    if (!allNames.includes(g)) allNames.push(g);
    present.add(g); guest.value = ""; updCount(); draw();
  }));
  updCount(); draw();

  m.foot.appendChild(modalBtn_("Save", "#1a9c4b", async function () {
    this.disabled = true; this.textContent = "Saving...";
    try {
      const text = allNames.filter(n => present.has(n)).join(", ");
      const res = await callCrudBackend_({
        action: "editRow", sheetName: currentTab, idColumn, id: recordId, data: { [key]: text }
      });
      if (res.success) {
        rec[key] = text; delete CACHE[currentTab];
        m.close();
        try { renderTable(); } catch (x) { console.error(x); }
        alert("उपस्थिति save हो गई (" + present.size + " उपस्थित)।");
      } else {
        alert("❌ Error: " + (res.msg || "Save nahi ho paya") + "\n\n(Meetings sheet mein '" + key + "' naam ka column hona chahiye)");
        this.disabled = false; this.textContent = "Save";
      }
    } catch (err) {
      console.error(err);
      alert("❌ " + (err.message || "Network error"));
      this.disabled = false; this.textContent = "Save";
    }
  }));
  m.foot.appendChild(modalBtn_("बंद करें", "#64748b", m.close));
}

/* ===========================
   VIEW record (popup)
   =========================== */
function viewRecord(incomingEnc, e) {
  if (e && e.preventDefault) e.preventDefault();
  const incoming = decodeURIComponent(incomingEnc || "");
  // find by ID first
  let rec = tableData.find(r => (r["ID"] || "") === incoming);

  // if not found, try member column
  if (!rec && SETTINGS && SETTINGS["MemberColumn"]) {
    const memberCol = SETTINGS["MemberColumn"];
    rec = tableData.find(r => (r[memberCol] || "") === incoming);
  }
  // last resort: any field match
  if (!rec) {
    rec = tableData.find(r => Object.values(r).some(v => String(v) === incoming));
  }
  if (!rec) {
    console.warn("viewRecord: record not found for:", incoming);
    el("popupTitle").innerText = "Record not found";
    el("popupBody").innerHTML = `<div class="muted">कोई रिकॉर्ड नहीं मिला: <b>${incoming}</b></div>`;
    el("receiptPopup").style.display = "flex";
    return;
  }
  // helper
 function rowItem(label, value) {

  // 🔥 Meetings + Announcements → ShowOnHome hide
  if (
    (currentTab === "Meetings" || currentTab === "Announcements") &&
    label === "ShowOnHome"
  ) {
    return "";
  }

  if (value === undefined || value === null || value === "") return "";

  return `<tr>
    <td style="font-weight:bold;width:20%">${label}</td>
    <td>${value}</td>
  </tr>`;
}

  function formatDateLocal(d) {
    if (!d) return "";
    const dt = new Date(d);
    return isNaN(dt) ? d : dt.toLocaleDateString("en-GB");
  }
  function toNumberLocal(v){ return Number(String(v||"").replace(/,/g,"")) || 0; }

  let heading = "", rows = "";
  // Members
  if (currentTab === "Members") {
    heading = "सदस्य जानकारी";
    rows += rowItem("समाज ID", rec["MemberID"] || rec["ID"]);
    rows += rowItem("सदस्य का नाम ", displayMemberFromRow_(rec));
    rows += rowItem("मोबाइल", rec[SETTINGS?.MobileColumn] || rec["Mobile"] || rec["Phone"]);
rows += rowItem("पेशा/व्यवसाय का नाम ", rec["Occupation / Business Name"] || "");
rows += rowItem("गोत्र  ", rec["Gotra"] || "");
   rows += rowItem("गांव   ", rec["Place of origin"] || ""); rows += rowItem("जिला    ", rec["District"] || ""); 
    rows += rowItem("वर्तमान शहर", rec[SETTINGS?.CityColumn] || rec["Current City"] || "");
    rows += rowItem("पता", rec["Address"] || "");
    let joinDate = rec["Joining Date"] || rec["Joined"] || rec["Join Date"] || rec["JoiningDate"];
    rows += rowItem("जॉइनिंग तारीख", formatDateLocal(joinDate));
    rows += rowItem("स्थिति", rec["Status"] || "");
  }
  // Fund Ledger (Hindi labels)
  else if (currentTab === "Fund Ledger") {
    heading = "फंड लेजर रसीद";
    rows += rowItem("लेन-देन ID", rec["ID"]);
    rows += rowItem("तारीख", formatDateLocal(rec["Date"] || rec["Payment Date"]));
    rows += rowItem("सदस्य का नाम ", displayMemberFromRow_(rec));
    rows += rowItem("मोबाइल", rec[SETTINGS?.MobileColumn] || rec["Mobile"] || "");
    rows += rowItem("शहर", rec[SETTINGS?.CityColumn] || rec["City"] || "");
    const creditCol = SETTINGS?.FundLedgerCreditColumn || "Credit";
    const debitCol  = SETTINGS?.FundLedgerDebitColumn  || "Debit";
    const creditVal = rec[creditCol];
    const debitVal  = rec[debitCol];
    if (toNumberLocal(creditVal) > 0) rows += rowItem(SETTINGS?.CreditLabel || "क्रेडिट (₹)", Number(String(creditVal).replace(/,/g,"")).toLocaleString());
    if (toNumberLocal(debitVal) > 0)  rows += rowItem(SETTINGS?.DebitLabel  || "डेबिट (₹)",  Number(String(debitVal).replace(/,/g,"")).toLocaleString());
    rows += rowItem("उद्देश्य (For)", rec["For"] || rec["Purpose"] || "");
    rows += rowItem("भुगतान का तरीका (Mode)", rec["Mode"] || "");
    rows += rowItem("नोट्स", rec["Notes"] || "");
    rows += rowItem("प्रकार (Type)", rec[SETTINGS?.FundLedgerTypeColumn || "Type"] || "");
  }
  // Receipts
  else if (currentTab === "Receipts") {
    heading = "रसीद";
    rows += rowItem("रसीद नंबर", rec["ID"]);
    rows += rowItem("तारीख", formatDateLocal(rec["Date"]));
    rows += rowItem("सदस्य का नाम ", displayMemberFromRow_(rec));
    rows += rowItem("रसीद राशि (₹)", rec["Received"]);
    rows += rowItem("उद्देश्य (For)", rec["For"]);
    rows += rowItem("भुगतान का तरीका (Mode)", rec["Mode"]);
    rows += rowItem("नोट्स", rec["Notes"]);
    rows += rowItem("प्रकार (Type)", rec["Type"]);
  }
  // Expenses
  else if (currentTab === "Expenses") {
    heading = "खर्चा विवरण";
    rows += rowItem("खर्चा नंबर", rec["ID"]);
    rows += rowItem("तारीख", formatDateLocal(rec["Date"]));
    rows += rowItem("सदस्य का नाम ", displayMemberFromRow_(rec));
    rows += rowItem("भुगतान राशि  (₹)", toNumberLocal(rec["Payment"]).toLocaleString());
    rows += rowItem("उद्देश्य (For)", rec["For"]);
    rows += rowItem("भुगतान का तरीका (Mode)", rec["Mode"]);
    rows += rowItem("नोट्स", rec["Notes"]);
    rows += rowItem("प्रकार (Type)", rec["Type"]);
  }
  // Boli
  else if (currentTab === "Boli") {
    heading = "बोली विवरण";
    const pledged = toNumberLocal(rec[SETTINGS?.BoliPledgedColumn] || rec["Pledged Boli"]);
    const paid = toNumberLocal(rec[SETTINGS?.BoliPaidColumn] || rec["Paid Boli"]);
    const balance = toNumberLocal(rec["Pending Dues Boli"] || (pledged - paid));

    rows += rowItem("सदस्य का नाम ", displayMemberFromRow_(rec));
    rows += rowItem("मोबाइल", rec[SETTINGS?.MobileColumn] || rec["Mobile"] || "");
    rows += rowItem("बोली राशि ₹", pledged.toLocaleString());
    rows += rowItem("भुगतान राशि ₹", paid.toLocaleString());
    rows += rowItem("बैलेंस राशि ₹", balance.toLocaleString());
    rows += rowItem("उद्देश्य (For)", rec["For"]);
  }
  // Donation
  else if (currentTab === "Donation") {
    heading = "दान विवरण";
    const pledged = toNumberLocal(rec[SETTINGS?.DonationPledgedColumn] || rec["Pledged Donation"]);
    const paid = toNumberLocal(rec[SETTINGS?.DonationPaidColumn] || rec["Paid Donation"]);
    const balance = toNumberLocal(rec["Pending Dues Donation"] || (pledged - paid));
    rows += rowItem("दान नं", rec["ID"]);
    rows += rowItem("तारीख", formatDateLocal(rec["Date"]));
    rows += rowItem("सदस्य का नाम ", displayMemberFromRow_(rec));
    rows += rowItem("मोबाइल", rec[SETTINGS?.MobileColumn] || rec["Mobile"] || "");
    rows += rowItem("दान राशि ₹", pledged.toLocaleString());
    rows += rowItem("भुगतान राशि ₹", paid.toLocaleString());
    rows += rowItem("बैलेंस राशि ₹", balance.toLocaleString());
    rows += rowItem("उद्देश्य (For)", rec["For"]);
  }
  // fallback
  else {
    heading = currentTab + " विवरण";
    for (let k in rec) rows += rowItem(k, rec[k]);
  }
  // render popup
  el("popupTitle").innerText = heading;
  el("popupBody").innerHTML = `<table class="popup-table">${rows}</table>`;
  el("receiptPopup").style.display = "flex";
  el("popupPrintBtn").onclick = () => {
    printPopupReceiptContent(heading, `<table class="popup-table">${rows}</table>`);
  };
  el("popupCloseBtn").onclick = () => {
    el("receiptPopup").style.display = "none";
  };
}

async function openEditRecord(incomingEnc, e){
  if (e && e.preventDefault) e.preventDefault();
  const incoming = decodeURIComponent(incomingEnc || "");
  let recIndex = tableData.findIndex(r => (resolveRecordId_(r).recordId || "") === incoming);
  if(recIndex === -1){
    // try match by member column / name
    recIndex = tableData.findIndex(r => (r[SETTINGS?.MemberColumn] || r["Member"] || "") === incoming);
  }
  if(recIndex === -1){
    alert("रिकॉर्ड नहीं मिला।");
    return;
  }
  const rec = {...tableData[recIndex]}; // copy
  const memberCol = SETTINGS?.MemberColumn || "Member";
  const { idColumn: resolvedIdColumn, recordId: resolvedRecordId } = resolveRecordId_(rec);
  let idColumn = resolvedIdColumn, recordId = resolvedRecordId;
  if (!idColumn) {
    alert("इस sheet (" + currentTab + ") में record पहचानने के लिए 'ID' column नहीं मिला। पहले sheet में एक 'ID' column जोड़ें, फिर Edit/Delete काम करेगा।");
    return;
  }

  // 🆕 Add form ki tarah, Edit popup bhi TURANT dikha do (loading state ke
  // saath) — formula-columns wale backend call (cached hone par bhi thoda
  // wait ho sakta hai) ke poora hone tak khaali screen na dikhe.
  el("editTitle").textContent = "Edit: " + (rec["ID"] || rec["MemberID"] || rec[SETTINGS?.MemberColumn] || "Record");
  el("editFields").innerHTML = "<p class='muted' style='grid-column:1 / -1'>⏳ Loading Data...</p>";
  el("saveEditBtn").disabled = true;
  el("editPopup").style.display = "flex";

  // 🆕 Formula-driven columns (jaise Paid Boli, Pending Dues) ko readonly dikhao
  let formulaColumns = [];
  try {
    formulaColumns = await getFormulaColumnsCached_(currentTab);
  } catch (e2) { /* best-effort */ }

  // Build fields
  const container = el("editFields");
  container.innerHTML = "";
  el("saveEditBtn").disabled = false; // 🆕 loading-state ke time disable kiya tha, ab wapas enable karo
  Object.keys(rec).forEach(k => {
    if(!k) return;
    const kl = k.toLowerCase();
    if(kl === "password" || kl === "role") return; // hidden fields not editable here
    if(SYNTHETIC_DISPLAY_COLUMNS.includes(k)) return; // 🆕 webapp-computed, sheet mein hai hi nahi
    if(/^commitments?$/.test(kl.trim())) return; // 🆕 📅 वादा popup se manage hota hai
    const val = rec[k] || "";
    const id = "ef_"+k.replace(/\s+/g,"_");
    const label = document.createElement("label"); label.textContent = k;

    let input, isTextarea = false;
    if (kl === "id" || formulaColumns.includes(k)) {
      // 🆕 ID ya koi bhi formula-column clearly readonly dikhao (edit nahi ho sakta)
      input = document.createElement("input");
      input.value = val;
      input.disabled = true;
      input.style.background = "#f0f0f0";
      input.style.fontWeight = "600";
    } else if (isDateField_(k)) {
      // 🆕 Native date-picker, existing DD/MM/YYYY value ko ISO mein convert karke dikhao
      input = document.createElement("input");
      input.type = "date";
      input.value = ddmmyyyyToISO_(val);
    } else {
      const built = buildSmartField_(k, val);
      input = built.el;
      isTextarea = built.isTextarea;
      var editRecentValues = built.recentValues; // 🆕
      if (input.tagName === "SELECT") {
        // group banane ke baad Other-toggle attach karenge (neeche)
      } else {
        const hint = samplePlaceholder_(k);
        if (hint && !val) input.placeholder = hint;
      }
    }
    input.id = id;
    const group = document.createElement("div");
    if (isTextarea) group.style.gridColumn = "1 / -1";
    group.appendChild(label);
    group.appendChild(input);
    container.appendChild(group);
    if (input.tagName === "SELECT") attachOtherToggle_(input, group, k);
    if (input.tagName === "TEXTAREA" && editRecentValues) attachRecallDropdown_(input, group, editRecentValues); // 🆕
    if (currentTab === "Meetings" && input.tagName === "TEXTAREA" && /detail|agenda/i.test(k)) attachAgendaPicker_(input, group); // 🆕
  });
  el("saveEditBtn").onclick = async () => {
    const updated = {};
    Object.keys(rec).forEach(k => {
      if(!k) return;
      const kl = k.toLowerCase();
      if(kl === "password" || kl === "role") return;
      const id = "ef_"+k.replace(/\s+/g,"_");
      const node = document.getElementById(id);
      if(node) updated[k] = (node.type === "date") ? isoToDDMMYYYY_(node.value) : node.value;
    });

    el("saveEditBtn").disabled = true;
    el("saveEditBtn").textContent = "Saving...";
    try {
      const res = await callCrudBackend_({
        action: "editRow",
        sheetName: currentTab,
        idColumn: idColumn,
        id: recordId,
        data: updated
      });

      if (res.success) {
        Object.keys(updated).forEach(k => tableData[recIndex][k] = updated[k]);
        delete CACHE[currentTab]; // taaki agla load fresh aaye
        el("editPopup").style.display = "none";
        renderTable();
        refreshDashboardAfterCrud_(); // 🆕 dashboard cards bhi live update
        alert("रिकॉर्ड Google Sheet में save हो गया है।");
      } else {
        alert("❌ Error: " + (res.msg || "Save nahi ho paya"));
      }
    } catch(err) {
      console.error(err);
      alert("❌ " + (err.message || "Network error, dobara try karein"));
    } finally {
      el("saveEditBtn").disabled = false;
      el("saveEditBtn").textContent = "Save";
    }
  };
  el("cancelEditBtn").onclick = () => {
    el("editPopup").style.display = "none";
  };
}

async function deleteRecord(incomingEnc, e){
  if (e && e.preventDefault) e.preventDefault();
  const incoming = decodeURIComponent(incomingEnc || "");
  if(!confirm("क्या आप वाकई इस रिकॉर्ड को स्थायी रूप से हटाना चाहते हैं? यह Google Sheet से भी हट जाएगा।")) return;
  // find index
  let idx = tableData.findIndex(r => (resolveRecordId_(r).recordId || "") === incoming);
  let idColumn = idx !== -1 ? resolveRecordId_(tableData[idx]).idColumn : "ID";
  if(idx === -1){
    alert("रिकॉर्ड नहीं मिला।");

  }

  try {

      action: "deleteRow",

function getVisibleTableData() {
  const table = document.querySelector("#contentArea table");
  if (!table) return { headers: [], rows: [] };

  const headers = Array.from(table.querySelectorAll("thead th"))
    .map(th => th.innerText.trim());

  let trList = Array.from(table.querySelectorAll("tbody tr"));
  // 🆕 Screen par latest-first dikhta hai, par export hamesha original ascending order mein
  if (table.dataset.latestFirst === "1") {
    trList.sort((a, b) => (+a.dataset.seq) - (+b.dataset.seq));
  }
  const rows = trList.map(tr =>
      Array.from(tr.children).map(td => td.innerText.trim())
    );

  return { headers, rows };
}

// 🆕 Excel sheet-naam mein yeh characters allowed nahi: \ / ? * [ ] aur 31
// character se lamba bhi nahi ho sakta — tab-name ko safe bana dete hain.
function sanitizeSheetName_(name) {
  return String(name || "Data").replace(/[\\/?*\[\]:]/g, "-").slice(0, 31) || "Data";
}

// 🆕 EK CLICK mein SAARE tabs (jinki role ko permission hai) ka data, ek hi
// Excel file mein, har tab apni alag sheet mein — aur jo bhi Year/FY/Custom
// date filter abhi upar select kiya hua hai, wahi filter HAR tab ke data par
// lagega (bilkul waisa hi jaisa currently table mein dikh raha hota agar us
// tab ko khola jaata).
async function exportAllTabsExcel() {
  if (!currentUser || !currentUser.role) {
    alert("Pehle login karein");
    return;
  }
  const accessList = ROLE_ACCESS?.[currentUser.role];
  if (!accessList) {
    alert("Is role ke liye tabs pata nahi chal paaye");
    return;
  }
  const tabNames = Object.keys(accessList).filter(t => accessList[t]?.canView);
  if (!tabNames.length) {
    alert("Export karne ke liye koi tab available nahi hai");
    return;
  }

  // 🆕 Excel+All-Excel ab ek hi button ("exportExcelBtn") ke dropdown mein hain
  const btn = document.getElementById("exportExcelBtn");
  const originalHTML = btn ? btn.innerHTML : "";
  if (btn) { btn.disabled = true; btn.innerHTML = "⏳ Export ho raha hai..."; }

  try {
    const range = getActiveDateFilterRange_(); // 🆕 abhi jo filter select hai, wahi sabpar lagega
    const wb = XLSX.utils.book_new();
    let anySheetAdded = false;

    for (const sheetName of tabNames) {
      let data = await fetchSheet(sheetName);
      if (!Array.isArray(data) || !data.length) continue;

      // 🆕 loadTab() jaisi hi special-case processing, taaki export bhi
      // exactly wahi dikhaye jo app mein us tab ko khol kar dikhta hai
      if (sheetName === "Members" && window.SETTINGS) {
        const activeValue = String(SETTINGS.ActiveStatusValue || "Active").trim().toLowerCase();
        data = data.filter(row => row && row.Status !== undefined &&
          String(row.Status).trim().toLowerCase() === activeValue);
      }
      if (sheetName === "Cash Book" || sheetName === "Bank Book") {
        let running = 0;
        data = data.map(r => {
          running += toNumber(r["Credit"]) - toNumber(r["Debit"]);
          return { ...r, "Balance": running };
        });
      }
      if (sheetName === "Transfer") {
        data = data.map(r => {
          const out = { ...r };
          delete out["Debit (From)"];
          delete out["Credit (To)"];
          delete out["Cash Balance"];
          delete out["Bank Balance"];
          return out;
        });
      }

      // 🆕 Active Year/FY/Custom-date filter yahan lagao
      if (range) data = data.filter(r => rowInDateRange_(r, range));
      if (!data.length) continue; // is tab mein filter ke baad kuch nahi bacha — sheet mat banao

      const headers = Array.from(new Set(data.flatMap(row => Object.keys(row)))).filter(Boolean);
      const aoa = [headers, ...data.map(row => headers.map(h => row[h] ?? ""))];
      const ws = XLSX.utils.aoa_to_sheet(aoa);
      XLSX.utils.book_append_sheet(wb, ws, sanitizeSheetName_(sheetName));
      anySheetAdded = true;
    }

    if (!anySheetAdded) {
      alert("Chune hue filter ke liye kisi bhi tab mein data nahi mila");
      return;
    }

    const filterTag = getActiveFilterLabel_().replace(/[^\w\u0900-\u097F-]+/g, "_");
    XLSX.writeFile(wb, `All_Tabs_Export_${filterTag}.xlsx`);

  } catch (err) {
    console.error(err);
    alert("❌ Export mein samasya hui: " + (err.message || "dobara try karein"));
  } finally {
    if (btn) { btn.disabled = false; btn.innerHTML = originalHTML; }
  }
}


function exportPDF() {

  const table = document.querySelector("#contentArea table");
  if (!table) {
    alert("Table nahi mila");
    return;
  }

  const clone = table.cloneNode(true);

  // 🆕 Screen par latest-first dikhta hai, par PDF/print hamesha original ascending order mein
  if (clone.dataset.latestFirst === "1") {
    const tb = clone.querySelector("tbody");
    if (tb) {
      Array.from(tb.querySelectorAll("tr"))
        .sort((a, b) => (+a.dataset.seq) - (+b.dataset.seq))
        .forEach(tr => tb.appendChild(tr));
    }
  }

  // ❌ remove last column
  clone.querySelectorAll("tr").forEach(row => {
    if (row.children.length > 0) {
      row.children[row.children.length - 1].remove();
    }
  });

  const wrapper = document.createElement("div");
  wrapper.style.padding = "10px";

  // ✅ Date
  const today = new Date().toLocaleDateString("en-GB");

 wrapper.innerHTML = `
  <h2 style="text-align:center; margin:0;">
    श्री मेवाड़ प्रजापत समाज-वापी
  </h2>

  <div style="
    display:flex;
    justify-content:space-between;
    margin:4px 0 10px;
    font-size:12px;
  ">
    <div>Date: ${today}</div>
    <div><b>${currentTab || ""} — ${getActiveFilterLabel_()}</b></div>
  </div>
`;

  wrapper.appendChild(clone);

  // ✅ STYLE (IMPORTANT)
  clone.style.width = "100%";
  clone.style.borderCollapse = "collapse";

  clone.querySelectorAll("th").forEach(th => {
    th.style.border = "1px solid #bbb";
    th.style.background = "#f2f2f2";
    th.style.padding = "5px";
  });

  clone.querySelectorAll("td").forEach(td => {
    td.style.border = "1px solid #ccc";
    td.style.padding = "5px";
  });

  // ✅ MAGIC FIX (NO CUT / NO BLANK)
  clone.querySelectorAll("tr").forEach(tr => {
    tr.style.pageBreakInside = "avoid";
  });

  // ✅ HEADER REPEAT
  const thead = clone.querySelector("thead");
  if (thead) {
    thead.style.display = "table-header-group";
  }

  document.body.appendChild(wrapper);

  html2pdf().from(wrapper).set({
    margin: 8,
    filename: "report.pdf",
    html2canvas: { scale: 2 },
    jsPDF: { unit: "mm", format: "a4", orientation: "landscape" },
    pagebreak: { mode: ['css', 'legacy'] } // 🔥 KEY
  }).toPdf().get('pdf').then(function (pdf) {

    const totalPages = pdf.internal.getNumberOfPages();

    for (let i = 1; i <= totalPages; i++) {
      pdf.setPage(i);
      pdf.setFontSize(10);

      pdf.text(
        `Page ${i} of ${totalPages}`,
        pdf.internal.pageSize.getWidth() - 30,
        pdf.internal.pageSize.getHeight() - 5
      );
    }

  }).save().then(() => {
    wrapper.remove();
  });

}
